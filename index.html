<!DOCTYPE html>
<html lang="de">

  <link rel="stylesheet" href="style.css" />

  <header class="topbar">
    <div class="brand" onclick="zeigeStartseite()" style="cursor:pointer;">

      <span class="logo-text" style="text-transform:lowercase;">msam quiz kids</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="music-toggle-btn" class="btn-ghost" onclick="if(typeof appMusik !== 'undefined') appMusik.toggle()" title="Hintergrundmusik an/aus">

      <div class="star-pill">
        <span>⭐</span>
        <span id="star-count">0</span>

  <main id="main-content" class="container">
